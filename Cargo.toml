[package]
name = "rustyjs"
version = "0.1.0"
edition = "2024"
publish = false
description = "A JavaScript runtime embedding V8 with a Rust host"
repository = "https://github.com/MirHamzaHasan/rusty-js"

[dependencies]
tokio = { version = "1.54.1", features = ["rt", "time"] }
url = "2.5.8"
v8 = "=152.2.0"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["sync", "test-util"] }
